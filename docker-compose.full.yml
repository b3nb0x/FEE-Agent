# Full FEE-System: FEE-Agent + Paperless-ngx (Archiv/OCR) + Ollama (lokales LLM)
# Lenovo Sparks GDX: eigener lokaler KI-Endpoint – in der GUI als Provider
# „Sparks GDX" mit dessen IP+Port verbinden (OpenAI-kompatibel).
services:
  fee-agent:
    build: .
    restart: unless-stopped
    ports: ["8765:8765"]
    volumes:
      - ./data:/data
      - ./bea-inbox:/bea-inbox
      - ./paperless-consume:/paperless-consume
    environment:
      - FEE_MANDATE_DIR=/data/mandate
      - FEE_HOST_IP=${FEE_HOST_IP:-}
    depends_on: [paperless-ngx]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ./redis:/data

  paperless-ngx:
    image: ghcr.io/paperless-ngx/paperless-ngx:2.14.7
    restart: unless-stopped
    ports: ["8010:8000"]
    volumes:
      - ./paperless/data:/usr/src/paperless/data
      - ./paperless/media:/usr/src/paperless/media
      - ./paperless-consume:/usr/src/paperless/consume
    environment:
      - PAPERLESS_REDIS=redis://redis:6379
    depends_on: [redis]

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports: ["11435:11434"]
    volumes:
      - ./ollama:/root/.ollama
    # Modell ziehen: docker compose -f docker-compose.full.yml exec ollama ollama pull glm-4.7
