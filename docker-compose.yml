# FEE-Agent auf dem NAS – zentrale, selbstbestimmte Kanzlei-IT
# Daten liegen im Volume ./data (Mandate + SQLite-DB), nicht in irgendeiner Cloud.
#
# Starten:   docker compose up -d
# GUI:       http://<NAS-IP>:8765
#
# Optional mit Paperless-ngx (Langzeitarchiv + OCR) – einkommentieren für Kombination.

services:
  fee-agent:
    build: .
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - ./data:/data                 # Mandate + feeagent.db + users
      - ./bea-inbox:/bea-inbox       # beA-Client legt hier ab
      - ./paperless-consume:/paperless-consume  # Paperless-Übergabe (siehe unten)
    environment:
      - FEE_MANDATE_DIR=/data/mandate
      - FEE_AGENT_PORT=8765
      # PAM im Container ohne PC-Konten: stattdessen Nur-Token-Login?
      # Standard: PAM prüft gegen Container-User – für NAS siehe README (Auth-Abschnitt).

  # paperless-ngx (optional): eigenes Dokumentenarchiv mit OCR.
  # Konsumiert ./paperless-consume, archiviert nach ./paperless.
