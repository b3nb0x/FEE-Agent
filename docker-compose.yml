# FEE-Agent only (Docker) – Mandate + DB im Volume ./data
services:
  fee-agent:
    build: .
    restart: unless-stopped
    ports: ["8765:8765"]
    volumes:
      - ./data:/data
      - ./bea-inbox:/bea-inbox
    environment:
      - FEE_MANDATE_DIR=/data/mandate
      - FEE_HOST_IP=${FEE_HOST_IP:-}
